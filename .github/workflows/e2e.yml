name: e2e

on:
  push:
    branches:
      - main
      - develop
      - 'feat-**'
      - 'fix-**'
      - 'docs-**'
      - 'perf-**'
      - 'test-**'
      - 'chore-**'
  workflow_dispatch:

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DSH_HOME: /tmp/dsh-e2e
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dsh CLI
        run: npm install -g @deepseek-ai/dsh@0.1.0-rc.6

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: e2e gate (deterministic + install)
        run: bash scripts/check-all.sh --e2e
