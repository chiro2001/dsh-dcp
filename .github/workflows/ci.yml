name: ci

on:
  push:
    branches:
      - main
      - develop
      - 'feat-**'
      - 'fix-**'
      - 'docs-**'
      - 'perf-**'
      - 'test-**'
      - 'chore-**'
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Tests
        run: pnpm test

      - name: Package check
        run: pnpm check:package
